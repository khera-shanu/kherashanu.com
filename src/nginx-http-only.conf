events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # HTTP-only server for Let's Encrypt certificate acquisition
    server {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 ipv6=off;
        
        listen 80;
        listen [::]:80;
        server_name kherashanu.com;

        # ACME challenge location for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Proxy all other traffic to backend
        location / {
            # Use variable to allow nginx to start even if backend is down
            set $backend http://kherashanu:3000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Return 503 if backend is unavailable
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        location @backend_unavailable {
            return 503 "Application is starting, please try again in a moment.";
            add_header Content-Type text/plain;
        }
    }
}
