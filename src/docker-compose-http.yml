services:
  kherashanu:
    build:
      context: .
      dockerfile: Dockerfile
    image: kherashanu2:latest
    container_name: kherashanu
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-kherashanu@gmail.com}
      # Update redirect URI for HTTP
      - GOOGLE_REDIRECT_URI=http://kherashanu.com/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kherashanu-network

  nginx:
    image: nginx:alpine
    container_name: kherashanu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-http-only.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kherashanu
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kherashanu-network

networks:
  kherashanu-network:
    driver: bridge

volumes:
  kherashanu-data:
    driver: local
